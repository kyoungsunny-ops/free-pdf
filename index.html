<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무가입 무료 PDF</title>
<meta name="description" content="가입 없이 브라우저에서 PDF를 편집합니다. 펜·형광펜·글자·이미지 넣기, 쪽 정리, 합치기, 추출. 파일은 서버로 전송되지 않습니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📄%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic&family=Nanum+Myeongjo&family=Nanum+Pen+Script&family=Noto+Sans+KR&family=Noto+Serif+KR&display=swap">
<style>
:root{--bg:#f4f4f1;--surface:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#d9d9d2;--acc:#2f5fd0;--acc-ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--surface:#222227;--ink:#ececea;--mute:#9a9a96;--line:#38383e;--acc:#7a9cf0;--acc-ink:#0f1115}}
:root[data-theme="dark"]{--bg:#16161a;--surface:#222227;--ink:#ececea;--mute:#9a9a96;--line:#38383e;--acc:#7a9cf0;--acc-ink:#0f1115}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}
h1 small{font-weight:400;color:var(--mute);font-size:12px;margin-left:4px}
button,label.btn{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);margin-left:auto}
button:disabled{opacity:.45;cursor:default}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
input[type=color]{width:32px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
input[type=range]{width:80px}
main{max-width:1100px;margin:0 auto;padding:14px 10px 60px}
#drop{border:2px dashed var(--line);border-radius:14px;padding:48px 16px;text-align:center;color:var(--mute);background:var(--surface)}
#drop b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 auto 16px;width:fit-content;max-width:100%}
.ph{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-size:13px;color:var(--mute);gap:8px}
.ph button{padding:2px 8px;font-size:13px}
.cv{position:relative;margin:0 auto}
.cv canvas{position:absolute;left:0;top:0;display:block}
.cv .ov{touch-action:none;cursor:crosshair}
body.view .ov{touch-action:auto;pointer-events:none}
.cv input.ti{position:absolute;z-index:3;border:1px dashed var(--acc);background:rgba(255,255,255,.85);color:#000;padding:0 2px;outline:none;min-width:80px}
[hidden]{display:none!important}
.sw{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw.on{border-color:var(--ink)}
.wrap{display:flex;gap:12px;align-items:flex-start}
#pages{flex:1;min-width:0}
#side{width:150px;flex:none;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#side[hidden]{display:none}
.sh{padding:8px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.sh b{color:var(--ink);font-size:14px}
.sb{display:flex;gap:4px}
.sh button{padding:3px 6px;font-size:12px;flex:1}
#ext{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
#thumbs{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:10px;align-items:center}
.th{cursor:grab;text-align:center;font-size:12px;border:2px solid transparent;border-radius:6px;padding:3px;min-width:60px}
.th .tc{min-height:60px;background:var(--bg);display:flex;justify-content:center}
.th canvas{display:block;border:1px solid var(--line)}
.th.sel{border-color:var(--acc)}
.th.over{border-color:var(--acc);background:var(--bg)}
.th.dg{opacity:.4}
@media(max-width:760px){.wrap{flex-direction:column}#side{width:100%;position:static;max-height:none}#thumbs{flex-direction:row;overflow-x:auto;align-items:flex-start}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
@media print{header,#side,.ph,#toast,#drop,#nm,#bub,#ibub,body::before{display:none!important}main{padding:0;max-width:none}.card{border:0;margin:0 auto 8px}}
#nm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30}
#nm .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(360px,90vw);display:flex;flex-direction:column;gap:10px}
#nm .row{display:flex;align-items:center;gap:6px;color:var(--mute)}
#nm input{flex:1;min-width:0;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#nm .r{display:flex;justify-content:flex-end;gap:8px}
#nm .fm{display:flex;gap:14px;font-size:14px;color:var(--ink)}
#nm .fm label{display:flex;align-items:center;gap:4px}
#nm .fm input{flex:none;padding:0;border:0;width:auto}
#nm .ok{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
#ff{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px;max-width:150px}
#bub,#ibub{position:fixed;z-index:40;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.22);font-size:14px;width:max-content;max-width:calc(100vw - 16px)}
#bub::before,#ibub::before{content:"";position:absolute;top:-7px;left:calc(var(--ax,50%) - 6px);width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
#bub .r{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#bub .y,#ibub .y{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
</style>
</head>
<body class="view">
<header>
  <h1>무가입 무료 PDF <small>파일 서버 저장 없음</small></h1>
  <label class="btn">열기<input id="f1" type="file" accept="application/pdf" hidden></label>
  <label class="btn" title="다른 PDF를 뒤에 붙입니다">PDF 합치기<input id="f2" type="file" accept="application/pdf" multiple hidden></label>
  <button id="addp" title="맨 뒤에 빈 쪽을 추가합니다">빈 쪽 추가</button>
  <div class="grp" id="tools">
    <button data-t="pen">펜</button>
    <button data-t="hl">형광펜</button>
    <button data-t="tx">글자</button>
    <button data-t="img">이미지</button>
    <button data-t="view">읽기 모드</button>
  </div>
  <input id="f3" type="file" accept="image/*" hidden>
  <div class="grp"><input type="color" id="col" value="#e11d48" title="색"><input type="range" id="sz" min="1" max="10" value="3" title="굵기/글자 크기"><select id="ff" hidden title="글꼴"><option value="">기본 글꼴</option><option value="Noto Sans KR">Noto Sans KR</option><option value="Noto Serif KR">Noto Serif KR</option><option value="Nanum Gothic">나눔고딕</option><option value="Nanum Myeongjo">나눔명조</option><option value="Nanum Pen Script">나눔손글씨 펜</option><option value="Black Han Sans">블랙한산스</option></select></div>
  <div class="grp" id="hlc" data-c="#facc15" hidden title="형광펜 색"><button class="sw on" data-c="#facc15" style="background:#facc15"></button><button class="sw" data-c="#4ade80" style="background:#4ade80"></button><button class="sw" data-c="#f472b6" style="background:#f472b6"></button><button class="sw" data-c="#38bdf8" style="background:#38bdf8"></button><button class="sw" data-c="#fb923c" style="background:#fb923c"></button><button class="sw" data-c="#c084fc" style="background:#c084fc"></button></div>
  <button id="undo">되돌리기</button>
  <button id="del" hidden>선택 삭제</button>
  <button id="close" hidden>닫기</button>
  <button id="save" class="primary" disabled>PDF 저장</button>
</header>
<main>
  <div id="drop"><b>PDF 파일을 여기로 끌어놓거나 “열기”를 누르세요</b>파일은 이 기기의 브라우저 안에서만 처리되고 서버로 전송되지 않습니다.</div>
  <div class="wrap"><aside id="side" hidden><div class="sh"><b>쪽 정리</b><span>끌어서 순서 변경 · 체크해서 선택</span><div class="sb"><button id="selall">전체</button><button id="selno">해제</button></div><button id="ext">선택 쪽 추출</button></div><div id="thumbs"></div></aside><div id="pages"></div></div>
</main>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const {PDFDocument,rgb,degrees,LineCapStyle}=PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);
const pagesEl=$('#pages');
let pages=[],hist=[],tool='',io=null,fileName='편집됨.pdf';
const FONT='"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';

function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms)}

async function addFile(file){
  const bytes=new Uint8Array(await file.arrayBuffer());
  let pdf;
  try{pdf=await pdfjsLib.getDocument({data:bytes.slice()}).promise}
  catch(e){toast('열 수 없는 PDF입니다 (암호가 걸렸거나 손상된 파일)');return}
  if(!pages.length)fileName=file.name.replace(/\.pdf$/i,'')+'-편집.pdf';
  const s={bytes};
  for(let i=1;i<=pdf.numPages;i++)pages.push({s,i:i-1,pg:await pdf.getPage(i),rot:0,anns:[]});
  layout();
}
async function addFiles(list,replace){
  if(replace){pages=[];hist=[]}
  for(const f of list){if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name))await addFile(f)}
}
$('#f1').onchange=async e=>{await addFiles([...e.target.files],true);e.target.value=''};
$('#f2').onchange=async e=>{await addFiles([...e.target.files],false);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{e.preventDefault();await addFiles([...e.dataTransfer.files],!pages.length)});

function vp(p){
  const rotation=(p.pg.rotate+p.rot)%360;
  const w=pagesEl.clientWidth-24;
  const base=p.pg.getViewport({scale:1,rotation});
  return p.pg.getViewport({scale:Math.min(1.5,w/base.width),rotation});
}

function layout(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);draw(e.target._p,e.target)}}),{rootMargin:'600px'});
  pagesEl.innerHTML='';
  $('#drop').hidden=pages.length>0;$('#side').hidden=!pages.length;$('#close').hidden=!pages.length;
  $('#save').disabled=!pages.length;
  pages.forEach((p,n)=>{
    const v=vp(p);
    const c=document.createElement('section');
    c.className='card';c._p=p;p.card=c;
    c.innerHTML=`<div class="ph"><span>${n+1} / ${pages.length} 쪽</span><span><button data-a="up" title="위로">↑</button> <button data-a="dn" title="아래로">↓</button> <button data-a="l" title="왼쪽으로 회전">⟲</button> <button data-a="r" title="오른쪽으로 회전">⟳</button> <button data-a="add" title="이 쪽 아래에 빈 쪽 추가">＋ 빈 쪽</button> <button data-a="del">삭제</button></span></div><div class="cv" style="width:${v.width}px;height:${v.height}px"><canvas class="base"></canvas><canvas class="ov"></canvas></div>`;
    c.querySelector('.ph').onclick=e=>{
      const a=e.target.dataset.a;if(!a)return;if(a==='l'||a==='r')p.thc=null;
      if(a==='l')p.rot=(p.rot+270)%360;
      if(a==='r')p.rot=(p.rot+90)%360;
      if(a==='up'&&n>0)[pages[n-1],pages[n]]=[pages[n],pages[n-1]];
      if(a==='dn'&&n<pages.length-1)[pages[n+1],pages[n]]=[pages[n],pages[n+1]];
      if(a==='add')pages.splice(n+1,0,blankPage(p));
      if(a==='del'){pages.splice(n,1);hist=hist.filter(h=>h!==p)}
      layout();
    };
    pagesEl.appendChild(c);
    io.observe(c);
  });
  buildThumbs();
}

function drawAnn(ctx,a){
  if(a.k==='pen'){
    ctx.strokeStyle=a.c;ctx.lineWidth=a.w;ctx.lineCap=ctx.lineJoin='round';ctx.beginPath();
    a.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
    if(a.pts.length===1)ctx.lineTo(a.pts[0][0]+.01,a.pts[0][1]);
    ctx.stroke();
  }else if(a.k==='hl'){
    ctx.globalAlpha=.4;ctx.fillStyle=a.c;ctx.fillRect(a.x,a.y,a.w,a.h);ctx.globalAlpha=1;
  }else if(a.k==='img'){
    ctx.save();ctx.scale(1,-1);ctx.drawImage(a.im,a.x,-(a.y+a.h),a.w,a.h);ctx.restore();
  }else{
    ctx.fillStyle=a.c;ctx.font=`${a.sz}px ${ff(a)}`;ctx.textBaseline='alphabetic';
    ctx.save();ctx.scale(1,-1);ctx.fillText(a.t,a.x,-a.y);ctx.restore();
  }
}
function overlay(p,cur){
  if(!p.o)return;
  const ctx=p.o.getContext('2d'),t=p.v.transform,d=p.d;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,p.o.width,p.o.height);
  ctx.setTransform(d*t[0],d*t[1],d*t[2],d*t[3],d*t[4],d*t[5]);
  p.anns.forEach(a=>drawAnn(ctx,a));
  if(cur)drawAnn(ctx,cur);
  if(sel&&sel.p===p){
    const L=sel.list.filter(a=>p.anns.includes(a)),s=1/p.v.scale;
    ctx.save();ctx.strokeStyle='#2f5fd0';ctx.lineWidth=1.5*s;ctx.setLineDash([5*s,4*s]);
    L.forEach(a=>{const b=bbox(a);ctx.strokeRect(b.x,b.y,b.w,b.h)});
    if(L.length===1){const b=bbox(L[0]);ctx.setLineDash([]);ctx.fillStyle='#2f5fd0';ctx.fillRect(b.x+b.w-5*s,b.y-5*s,10*s,10*s);if(L[0].k!=='tx'){ctx.fillRect(b.x+b.w-4*s,b.y+b.h/2-4*s,8*s,8*s);ctx.fillRect(b.x+b.w/2-4*s,b.y-4*s,8*s,8*s)}}
    ctx.restore();
  }
}

function draw(p,card){
  const v=vp(p),d=devicePixelRatio||1;
  const b=card.querySelector('.base'),o=card.querySelector('.ov'),cv=card.querySelector('.cv');
  for(const x of [b,o]){x.width=Math.round(v.width*d);x.height=Math.round(v.height*d);x.style.width=v.width+'px';x.style.height=v.height+'px'}
  p.pg.render({canvasContext:b.getContext('2d'),viewport:v,transform:[d,0,0,d,0,0]});
  p.o=o;p.v=v;p.d=d;overlay(p);
  const pt=e=>{const r=o.getBoundingClientRect(),[x,y]=v.convertToPdfPoint(e.clientX-r.left,e.clientY-r.top),[a,b,c,d]=p.pg.view;return[Math.min(c,Math.max(a,x)),Math.min(d,Math.max(b,y))]};
  let cur=null,start=null;
  o.onpointerdown=e=>{
    if(tool==='view')return;
    if(editDown(e,p,pt,o))return;
    const q=pt(e),c=$('#col').value,s=+$('#sz').value;
    if(tool==='tx'){textInput(p,cv,e,q,c,s);return}
    o.setPointerCapture(e.pointerId);
    if(tool==='pen')cur={k:'pen',c,w:s,pts:[q]};
    else{start=q;cur={k:'hl',c:$('#hlc').dataset.c||'#facc15',x:q[0],y:q[1],w:0,h:0}}
  };
  o.onpointermove=e=>{
    if(ed){editMove(e,p,pt);return}
    if(!cur)return;const q=pt(e);
    if(cur.k==='pen')cur.pts.push(q);
    else{cur.x=Math.min(start[0],q[0]);cur.y=Math.min(start[1],q[1]);cur.w=Math.abs(q[0]-start[0]);cur.h=Math.abs(q[1]-start[1])}
    overlay(p,cur);
  };
  o.onpointerup=()=>{
    if(ed){
      const d0=ed;ed=null;
      if(d0.edit&&!d0.moved)editText(p,d0.a,cv);
      return;
    }
    if(!cur)return;
    if(cur.k==='pen'&&cur.pts.every(t=>Math.hypot(t[0]-cur.pts[0][0],t[1]-cur.pts[0][1])*p.v.scale<4)){
      const h=hitPen(p,cur.pts[0]);cur=null;select(p,h);overlay(p);return;
    }
    if(cur.k!=='hl'||(cur.w>2&&cur.h>2)){p.anns.push(cur);hist.push(p);if(cur.k==='hl')select(p,cur);else select(null)}
    cur=null;overlay(p);
  };
}

function textInput(p,cv,e,q,c,s){
  const sz=s*4+8,r=cv.getBoundingClientRect(),px=sz*p.v.scale;
  const i=document.createElement('input');
  i.className='ti';i.style.left=(e.clientX-r.left)+'px';i.style.top=(e.clientY-r.top-px*.85)+'px';
  i.style.fontSize=px+'px';i.style.lineHeight='1.2';i.style.fontFamily=ffn();i.placeholder='글자 입력';
  let done=false;
  const fin=ok=>{
    if(done)return;done=true;
    const t=i.value.trim();i.remove();
    if(ok&&t){const a={k:'tx',c,sz,t,f:$('#ff').value,x:q[0],y:q[1]};p.anns.push(a);hist.push(p);clampAnn(p,a);select(p,a);fontReady(p,a)}
  };
  i.onkeydown=ev=>{if(ev.key==='Enter')fin(true);if(ev.key==='Escape')fin(false)};
  i.onblur=()=>fin(true);
  cv.appendChild(i);
  setTimeout(()=>i.focus(),0);
}

$('#tools').onclick=e=>{
  const t=e.target.dataset.t;if(!t)return;
  if(t==='img'&&tool==='img'){$('#ibub')?ibubClose():ibubOpen();return}
  ibubClose();
  tool=tool===t?'':t;document.body.classList.toggle('view',tool===''||tool==='view');select(null);ctl();
  if(tool==='img')ibubOpen();
  document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t===tool));
};
$('#hlc').onclick=e=>{const c=e.target.dataset.c;if(!c)return;$('#hlc').dataset.c=c;if(sel){sel.list.filter(a=>a.k==='hl').forEach(a=>a.c=c);overlay(sel.p)}[...$('#hlc').children].forEach(b=>b.classList.toggle('on',b===e.target))};
$('#undo').onclick=()=>{const p=hist.pop();if(p){p.anns.pop();overlay(p)}};

const hex=h=>{const n=parseInt(h.slice(1),16);return rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255)};
async function stamp(doc,pg,a){
  const color=hex(a.c);
  if(a.k==='pen'){
    if(a.pts.length===1)pg.drawCircle({x:a.pts[0][0],y:a.pts[0][1],size:a.w/2,color});

      const t=v.transform;x.setTransform(t[0],t[1],t[2],t[3],t[4],t[5]);
      p.anns.forEach(a=>drawAnn(x,a));x.setTransform(1,0,0,1,0,0);
      last=await new Promise(r=>c.toBlob(r,mime,.92));
      zip.file(`${sv.base}-${String(i+1).padStart(3,'0')}.${ext}`,last);
    }
    if(list.length===1)await dlBlob(last,`${sv.base}.${ext}`);
    else await dlBlob(await zip.generateAsync({type:'blob'}),`${sv.base}-${ext}.zip`);
  }catch(e){
    if(e&&e.code==='declined')toast('저장을 취소했습니다');else toast('저장에 실패했습니다');
  }finally{btn.disabled=false;btn.textContent=label}
}
function penHandle(e,p,o,a){
  const b=bbox(a),r=o.getBoundingClientRect();
  const near=(X,Y)=>{const [sx,sy]=p.v.convertToViewportPoint(X,Y);return Math.hypot(e.clientX-r.left-sx,e.clientY-r.top-sy)<=14};
  const m=near(b.x+b.w,b.y)?'rs':near(b.x+b.w,b.y+b.h/2)?'rw':near(b.x+b.w/2,b.y)?'rh':'';
  return m?{m,p,a,b,p0:a.pts.map(t=>[t[0],t[1]])}:null;
}
function penScale(p,ed,q,e){
  const a=ed.a,b=ed.b,r=a.w/2,iL=b.x+r,iT=b.y+b.h-r,wi=b.w-2*r,hi=b.h-2*r;
  let sx=ed.m==='rh'||wi<1?1:(q[0]-r-iL)/wi,sy=ed.m==='rw'||hi<1?1:(iT-r-q[1])/hi;
  sx=Math.max(.1,sx);sy=Math.max(.1,sy);
  if(ed.m==='rs'&&e&&e.shiftKey){const k=Math.max(sx,sy);sx=sy=k}
  ed.p0.forEach((t,i)=>{a.pts[i][0]=iL+(t[0]-iL)*sx;a.pts[i][1]=iT-(iT-t[1])*sy});
  clampAnn(p,a);
}
function ibubClose(){const b=$('#ibub');if(b){b.remove();document.removeEventListener('pointerdown',ibubAway,true)}}
function ibubAway(ev){const b=$('#ibub');if(b&&!b.contains(ev.target)&&ev.target.dataset.t!=='img')ibubClose()}
function ibubOpen(){
  ibubClose();
  const btn=document.querySelector('[data-t=img]'),r=btn.getBoundingClientRect(),m=document.createElement('div');
  m.id='ibub';m.innerHTML='<button class="y">＋ 이미지 넣기</button>';
  document.body.appendChild(m);
  const left=Math.max(8,Math.min(innerWidth-m.offsetWidth-8,r.left+r.width/2-m.offsetWidth/2));
  m.style.top=(r.bottom+10)+'px';m.style.left=left+'px';m.style.setProperty('--ax',(r.left+r.width/2-left)+'px');
  m.querySelector('.y').onclick=()=>{ibubClose();$('#f3').click()};
  setTimeout(()=>document.addEventListener('pointerdown',ibubAway,true),0);
}
function closeDoc(){pages=[];hist=[];select(null);fileName='편집됨.pdf';layout()}
$('#close').onclick=()=>{
  const old=$('#bub');
  if(old){old.remove();return}
  if(!pages.some(p=>p.anns.length||p.rot)){closeDoc();return}
  const b=$('#close'),r=b.getBoundingClientRect(),m=document.createElement('div');
  m.id='bub';
  m.innerHTML='<div>저장 후 닫으세요.<br>그냥 닫겠습니까?</div><div class="r"><button class="n">아니오</button><button class="y">예</button></div>';
  document.body.appendChild(m);
  const left=Math.max(8,Math.min(innerWidth-m.offsetWidth-8,r.left+r.width/2-m.offsetWidth/2));
  m.style.top=(r.bottom+10)+'px';m.style.left=left+'px';
  m.style.setProperty('--ax',(r.left+r.width/2-left)+'px');
  const off=()=>{m.remove();document.removeEventListener('pointerdown',away,true)};
  const away=ev=>{if(!m.contains(ev.target)&&ev.target!==b)off()};
  m.querySelector('.n').onclick=off;
  m.querySelector('.y').onclick=()=>{off();closeDoc()};
  setTimeout(()=>document.addEventListener('pointerdown',away,true),0);
};
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>pages.length&&layout(),250)});
